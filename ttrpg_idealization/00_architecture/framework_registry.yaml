edges:
  # Structural spine (contains = placement only, no dependency)
  - from: framework
    to: area.core-engine
    relation: contains
  - from: framework
    to: area.actor
    relation: contains
  - from: framework
    to: area.adventure
    relation: contains
  - from: framework
