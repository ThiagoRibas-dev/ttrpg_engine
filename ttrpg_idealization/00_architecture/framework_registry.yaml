  - from: framework
    to: area.equipment
    relation: contains
  - from: framework
    to: area.world-gm
    relation: contains
  - from: framework
    to: area.reference
    relation: contains

  # Core Engine specifications
  - from: area.core-engine
    to: core.checks-and-pools
    relation: contains
  - from: area.core-engine
    to: core.difficulty-and-target-numbers
    relation: contains
  - from: area.core-engine
    to: core.boons-banes-and-die-steps
    relation: contains

  # Core Engine internal semantics
  - from: core.checks-and-pools
    to: core.difficulty-and-target-numbers
    relation: uses
  - from: core.boons-banes-and-die-steps
    to: core.checks-and-pools
    relation: uses

  # Research calibrates canonical procedures
  - from: research.tier-difficulty-vectors
    to: core.difficulty-and-target-numbers
    relation: tests

  # Architecture documents (informational cross-links)
  - from: arch.map
    to: arch.relationship-vocabulary
    relation: related

