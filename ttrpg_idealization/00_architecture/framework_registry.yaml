version: 1
project: ttrpg-framework-rewrite
status: active

# Source of truth for formal document relationships.
# Relationship vocabulary: APPROVED per DEC-106 (requires, uses, grants,
# modifies, limits, tests, replaces, contains, related).
# See relationship_vocabulary.md for definitions and scope rules.
#
# Generated views (indexes, diagrams, impact reports) are produced on demand
# from this file and are never hand-maintained (DEC-105).
#
# Layering rule (framework spine): later layers may `uses`/`modifies` earlier
# procedures; earlier layers must not `requires` later layers; a hard
# `requires` cycle is a validation warning.
#
# Seeded 2026-08-29 per DEC-107. Core Engine Batches 1-3 migrated
# 2026-09-18/19 (DEC-109); first research node registered with Batch 2.

